# CrossPool source case 59: 085f0137-e7ff-411f-a36d-3d29fa8b9fce
# Missing MuxServe implementation for CrossPool topology: atn1-ffn1-lanes1
[serving_cases.e7b57cc7-288e-401c-9540-8b418dc41d7c]
description = "PENDING / NOT RUNNABLE: MuxServe: LLaMA-7B/13B one-Lane comparison against two Lanes on the same device fleet at 4 RPS per model."
module = "serving.muxserve_topology_pending"
mode = "owned"
deployment = "pending-deployments/muxserve-atn1-ffn1-lanes1.toml"
seed = 0

[serving_cases.e7b57cc7-288e-401c-9540-8b418dc41d7c.arrivals]
kind = "poisson"
duration_seconds = 60.0
rates = { "huggyllama/llama-7b" = 4.0, "huggyllama/llama-13b" = 4.0 }

[[serving_cases.e7b57cc7-288e-401c-9540-8b418dc41d7c.targets]]
model_id = "huggyllama/llama-7b"
graph_mode = "decode-full-prefill-breakable"
output_tokens = { kind = "lognormal", median_fraction = 0.03125, sigma = 1.0, max_output_input_ratio = 2.0 }
prompts = { kind = "random", input_tokens = { kind = "lognormal", median_fraction = 0.125, sigma = 1.0 } }

[[serving_cases.e7b57cc7-288e-401c-9540-8b418dc41d7c.targets]]
