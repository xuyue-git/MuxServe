base_url = "http://127.0.0.1:18080/models/llama13b"
prompts = { kind = "jsonl", path = "inputs/fig5-a0.7-s1.0/prompts-llama-13b.jsonl" }
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

[[serving_cases.2bdea08f-077a-4e4b-9b74-f7edcf0ed5c1.targets]]
