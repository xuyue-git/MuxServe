# MuxServe on SGLang: xbench serving catalogue (CrossPool xbench 3c1f976 schema).
#
# Client-mode cases: the server is launched separately with one config file and
# one command, and xbench drives it over HTTP. Every experimental condition is
# stated here; paths are relative to this file. See README.md for the commands.
#
#   server  python -m muxserve.launch configs/<config>.json      (repository root)
#   client  uv run --project <CrossPool checkout> xbench run \
#               --catalog benchmark/xbench/benches.toml --case <case-id prefix>
#
# Common to all cases
#   models      huggyllama/llama-7b, llama-13b, llama-30b; FP16, TP4 on four A100 40 GB
#   endpoint    native SGLang /generate (SSE) at http://127.0.0.1:18080/models/<name>
#   sampling    greedy (temperature 0), stream every token, EOS ignored (exact lengths)
#   inflight    at most 128 active HTTP requests in total; later arrivals queue (FIFO)

# --- 1. Fixed 512/128, Poisson arrivals generated by xbench ------------------
# Server config: configs/a100_xbench_poisson.json
[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358]
description = "MuxServe-SGLang, 3 LLaMA models, fixed 512-token prompt / 128 output tokens, xbench Poisson arrivals 0.5 RPS per model for 600 s."
module = "serving.multi_model"
mode = "client"
seed = 0
max_inflight = 128
warmup_requests_per_target = 2
request_timeout_seconds = 330.0

[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358.arrivals]
kind = "poisson"
duration_seconds = 600.0
rates = { "huggyllama/llama-7b" = 0.5, "huggyllama/llama-13b" = 0.5, "huggyllama/llama-30b" = 0.5 }

[[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358.targets]]
model_id = "huggyllama/llama-7b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama7b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-7b.jsonl" }
output_tokens = 128
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

[[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358.targets]]
model_id = "huggyllama/llama-13b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama13b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-13b.jsonl" }
output_tokens = 128
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

[[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358.targets]]
model_id = "huggyllama/llama-30b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama30b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-30b.jsonl" }
output_tokens = 128
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

# --- 2. Fixed 512/128, Poisson trace from original MuxServe's generator -----
# Same rates and duration as case 1; arrivals are frozen in a trace produced by
# muxserve.muxsched.workload_utils.PoissonProcess (make_inputs.py): 903 requests
# (298 / 290 / 315), each with max_new_tokens 128.
# Server config: configs/a100_xbench_poisson.json
[serving_cases.279fe35b-551b-4716-a373-521e1bde7f92]
description = "MuxServe-SGLang, 3 LLaMA models, fixed 512-token prompt / 128 output tokens, trace replay of original MuxServe Poisson arrivals at 0.5 RPS per model for 600 s."
module = "serving.multi_model"
mode = "client"
seed = 0
max_inflight = 128
warmup_requests_per_target = 2
request_timeout_seconds = 330.0

[serving_cases.279fe35b-551b-4716-a373-521e1bde7f92.arrivals]
kind = "jsonl"
path = "inputs/fixed-512/trace-poisson-0.5rps-600s.jsonl"
duration_seconds = 600.0

[[serving_cases.279fe35b-551b-4716-a373-521e1bde7f92.targets]]
model_id = "huggyllama/llama-7b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama7b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-7b.jsonl" }
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

[[serving_cases.279fe35b-551b-4716-a373-521e1bde7f92.targets]]
model_id = "huggyllama/llama-13b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama13b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-13b.jsonl" }
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

[[serving_cases.279fe35b-551b-4716-a373-521e1bde7f92.targets]]
model_id = "huggyllama/llama-30b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama30b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-30b.jsonl" }
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

# --- 3. Paper Figure 5 point: ShareGPT, alpha 0.7, rate scale 1.0 ------------
# Power-law popularity: rate_i = 2.0 * 1.0 / (i + 1)^0.7 -> 2.0 / 1.2311 / 0.9269 req/s
# for 7B / 13B / 30B; Poisson arrivals over 60 s (257 requests: 121 / 76 / 60);
# ShareGPT V3 prompts and output lengths (original sample_requests, seed 42);
# outputs not capped beyond each request's length. No warmup, as in the original's
# Figure 5 replay. Server config: configs/a100_open_loop.json
[serving_cases.2bdea08f-077a-4e4b-9b74-f7edcf0ed5c1]
