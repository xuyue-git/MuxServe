# MuxServe multi-model serving catalogue in CrossPool's case format.
# Source: Coekjan/CrossPool@0d3267edecfbe67459c1e9edc62ee73ff1f1a63f, benches/benches.toml (MIT).
# 20 cases: the paper's Figure 5 grid (alpha 0.7-2.1 x rate scale 1.0-2.5) on the default
# LLaMA-7B/13B/30B deployment, four A100 40 GB, server config configs/a100_open_loop.toml.
# Case 2bdea08f is the alpha 0.7 / rate scale 1.0 point; the other 19 are written by
# make_inputs.py --fig5. Run one case per invocation: client cases take no device lease,
# so cases named together run concurrently. See README.md before running. Server launch
# is explicit and outside xbench.

# --- Paper Figure 5 point: ShareGPT, alpha 0.7, rate scale 1.0 ---------------
# Power-law popularity: rate_i = 2.0 * 1.0 / (i + 1)^0.7 -> 2.0 / 1.2311 / 0.9269 req/s
# for 7B / 13B / 30B; Poisson arrivals over 60 s (257 requests: 121 / 76 / 60);
# ShareGPT V3 prompts and output lengths (original sample_requests, seed 42);
# outputs not capped beyond each request's length. No warmup, as in the original's
# Figure 5 replay. Server config: configs/a100_open_loop.toml
[serving_cases.2bdea08f-077a-4e4b-9b74-f7edcf0ed5c1]
description = "MuxServe-SGLang, 3 LLaMA models, paper Figure 5 point alpha 0.7 rate scale 1.0: ShareGPT prompts, power-law Poisson trace, 60 s, 257 requests."
module = "serving.multi_model"
mode = "client"
seed = 0
max_inflight = 128
warmup_requests_per_target = 0
request_timeout_seconds = 330.0

[serving_cases.2bdea08f-077a-4e4b-9b74-f7edcf0ed5c1.arrivals]
kind = "jsonl"
path = "inputs/fig5-a0.7-s1.0/trace.jsonl"
duration_seconds = 60.0

[[serving_cases.2bdea08f-077a-4e4b-9b74-f7edcf0ed5c1.targets]]
model_id = "huggyllama/llama-7b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama7b"
prompts = { kind = "jsonl", path = "inputs/fig5-a0.7-s1.0/prompts-llama-7b.jsonl" }
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

[[serving_cases.2bdea08f-077a-4e4b-9b74-f7edcf0ed5c1.targets]]
model_id = "huggyllama/llama-13b"
