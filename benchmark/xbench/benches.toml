# MuxServe multi-model serving catalogue, following CrossPool's full case structure.
# Source: Coekjan/CrossPool@0d3267edecfbe67459c1e9edc62ee73ff1f1a63f, benches/benches.toml (MIT).
# 80 active workload declarations: 3 three-model cases on the default 7B/13B/30B
# deployment first, then CrossPool's 58 pair/isolated declarations, then the other
# 19 points of the paper's Figure 5 grid (written by make_inputs.py --fig5). CrossPool's
# final 3 topology declarations are in pending-topologies.toml and cannot run.
# Models/endpoints/native server configs are MuxServe-specific. Source UUIDs below
# identify the reference only; each migrated condition has its own UUIDv4.
# Joint input/output lognormal policies are preserved exactly, not split or clipped.
# Random inputs reach up to 2047 tokens (context 2048); the pair/isolated server
# configs therefore set max_input_tokens 2047. Run one case per invocation:
# client cases take no device lease, so cases named together run concurrently.
# See README.md before running. Server launch is explicit and outside xbench.
# Client defaults match upstream: warmup1/target, max_inflight128, bucket1s,
# no HTTP timeout; random prompts ignore EOS. Server deadline remains300s.

# ===========================================================================
# Three-model cases: the default deployment, LLaMA-7B/13B/30B on four A100 40 GB.
# Each case names its server config. These keep their original case IDs.
# ===========================================================================

# --- 1. Fixed 512/128, Poisson arrivals generated by xbench ------------------
# Server config: configs/a100_xbench_poisson.toml
[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358]
description = "MuxServe-SGLang, 3 LLaMA models, fixed 512-token prompt / 128 output tokens, xbench Poisson arrivals 0.5 RPS per model for 600 s."
module = "serving.multi_model"
mode = "client"
seed = 0
max_inflight = 128
warmup_requests_per_target = 2
request_timeout_seconds = 330.0

[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358.arrivals]
kind = "poisson"
duration_seconds = 600.0
rates = { "huggyllama/llama-7b" = 0.5, "huggyllama/llama-13b" = 0.5, "huggyllama/llama-30b" = 0.5 }

[[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358.targets]]
model_id = "huggyllama/llama-7b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama7b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-7b.jsonl" }
output_tokens = 128
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

[[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358.targets]]
model_id = "huggyllama/llama-13b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama13b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-13b.jsonl" }
output_tokens = 128
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

[[serving_cases.55af3ef0-c453-484f-86ed-62429f9c8358.targets]]
model_id = "huggyllama/llama-30b"
api = "sglang"
base_url = "http://127.0.0.1:18080/models/llama30b"
prompts = { kind = "jsonl", path = "inputs/fixed-512/prompts-llama-30b.jsonl" }
output_tokens = 128
sampling = { temperature = 0.0, stream_interval = 1, ignore_eos = true }

