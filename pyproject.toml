[build-system]
# The Head-wise CUDA extension builds against the same Torch it runs with.
requires = ["setuptools>=68", "wheel", "torch==2.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muxserve"
version = "0.1.0"
description = "Flexible spatial-temporal multiplexing for multiple LLM serving, on SGLang"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MuxServe Team" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # The pinned SGLang fork, from the sibling engine repository (tool.uv.sources).
    "sglang==0.5.20",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchvision==0.28.0",
    "transformers==5.12.1",
    "sglang-kernel==0.4.7",
    "aiohttp",
    "numpy",
    "pyyaml",
    # Placement optimizer only (muxserve.muxsched.placement).
    "cvxpy",
]

[project.scripts]
# uv run muxserve CONFIG.json   is   python -m muxserve.launch CONFIG.json
muxserve = "muxserve.launch:main"

[tool.setuptools.packages.find]
include = ["muxserve", "muxserve.*"]

[tool.uv]
required-version = ">=0.11"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Editable installs as plain path entries: preflight accepts only filesystem
# imports, and the SGLang fork's hooks import muxserve from this checkout.
config-settings = { editable_mode = "compat" }
python-preference = "managed"

[tool.uv.sources]
sglang = { path = "../MuxServe-SGLang-Engine", editable = true }
