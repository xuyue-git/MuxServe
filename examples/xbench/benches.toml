# xbench cases for the paper's Figure 5 grid, in CrossPool's hosted case format
# (Coekjan/CrossPool@987b2d5777725494d56ebbaaa1f918c90b9cfbd4, docs/tutorials/xbench.md, MIT):
# alpha {0.7, 0.9, 1.3, 1.7, 2.1} x rate scale {1.0, 1.5, 2.0, 2.5}, 20 cases. The original's
# copy (Muxserve-change, examples/xbench/benches.toml) and the baseline's copy
# (benchmark/xbench/benches.toml) are the same file; each case starts the server.py next to it.
#
# xbench starts and stops the server (mode "hosted"): it runs server.py with the point's alpha
# and rate scale (launch_settings) on four GPUs it leases from CUDA_VISIBLE_DEVICES, on an HTTP
# port it picks, and sends OpenAI Completions requests (README.md). The requests are generated
# as in CrossPool's own cases (benches/benches.toml there):
#   arrivals  Poisson over 60 s at the paper's power-law rates, 2.0 * S / (rank + 1)^alpha req/s
#             for 7B / 13B / 30B (rank 0 / 1 / 2), the rates the server's ADBS is given;
#   prompts   random token ids, log-normal length (median 1/8 of the legal range, sigma 1);
#   outputs   log-normal length (median 1/32 of the legal range, sigma 1, at most 2x the input),
#             greedy, EOS ignored (MuxServe always generates the full length).
# Seed 0 for every case, so both versions get identical requests; the request counts below are
# xbench's for that seed. No warmup, as in the original's Figure 5 replay.

# --- p01: alpha 0.7, rate scale 1.0 ----------------------------------------------------
# 2.0 / 1.2311 / 0.9269 req/s -> 234 requests (106 / 72 / 56), 77519 input and
# 7276 output tokens.
[serving_cases.596bb910-2d15-4ce8-a3bd-8bd4805641ff]
description = "MuxServe, 3 LLaMA models on 4 GPUs, paper Figure 5 point alpha 0.7 rate scale 1.0: Poisson arrivals at 2.0 / 1.2311 / 0.9269 req/s over 60 s (234 requests), random prompts and outputs."
mode = "hosted"
script = "server.py"
launch_settings = { alpha = 0.7, rate_scale = 1.0 }
seed = 0
max_inflight = 128
warmup_requests_per_target = 0
request_timeout_seconds = 330.0

[serving_cases.596bb910-2d15-4ce8-a3bd-8bd4805641ff.arrivals]
kind = "poisson"
duration_seconds = 60.0
rates = { "huggyllama/llama-7b" = 2.0, "huggyllama/llama-13b" = 1.2311444133449163, "huggyllama/llama-30b" = 0.9269261135439395 }

[[serving_cases.596bb910-2d15-4ce8-a3bd-8bd4805641ff.targets]]
model_id = "huggyllama/llama-7b"
prompts = { kind = "random", input_tokens = { kind = "lognormal", median_fraction = 0.125, sigma = 1.0 } }
output_tokens = { kind = "lognormal", median_fraction = 0.03125, sigma = 1.0, max_output_input_ratio = 2.0 }
sampling = { temperature = 0.0, ignore_eos = true }

